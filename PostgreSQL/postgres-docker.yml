services:
  postgres:
    image: postgres:18.4-bookworm
    container_name: cursopostgres
    restart: always
    environment:
      - POSTGRES_USER=elefante
      - POSTGRES_PASSWORD=e_le_fan_te
      - POSTGRES_DB=cursopostgres
    volumes:
      - cursopostgres:/var/lib/postgresql
    ports:
      - "5432:5432"
  
  
volumes:
  cursopostgres:
    driver: local
    driver_opts:
      type: none
      device: D:\Novo\PostgreSQL\datos
      o: bind
