services:
  proxy:
    image: nginx:alpine
    networks:
      - redUno
      
      
  app:
    image: nicolaka/netshoot
    command: sleep infinity
    networks:
      - redUno
      - redDos
      
      
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pit
      POSTGRES_USER: pituser
      POSTGRES_PASSWORD: pitpassword
    networks:
      - redDos
      
networks:
  redUno:
  redDos:
      